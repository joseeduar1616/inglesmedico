    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- MOCK REATIVO DAS BIBLIOTECAS FIREBASE ---
        let mockDatabase = {};
        let onSnapshotCallback = null;

        const mockFirebase = {
            initializeApp: () => ({}),
            getAuth: () => ({
                currentUser: { uid: 'test-user-123' }
            }),
            onAuthStateChanged: (auth, callback) => {
                const mockUser = { uid: 'test-user-123' };
                callback(mockUser);
                return () => {};
            },
            getFirestore: () => ({}),
            doc: () => ({}), // A referência do documento é simbólica no mock
            getDoc: async (docRef) => {
                const data = mockDatabase['test-user-123'];
                return {
                    exists: () => !!data,
                    data: () => data
                };
            },
            setDoc: async (docRef, data, options) => {
                const userId = 'test-user-123';
                if (options && options.merge) {
                    mockDatabase[userId] = { ...mockDatabase[userId], ...data };
                } else {
                    mockDatabase[userId] = data;
                }
                if (onSnapshotCallback) {
                    const updatedData = mockDatabase[userId];
                    onSnapshotCallback({ exists: () => !!updatedData, data: () => updatedData });
                }
            },
            onSnapshot: (docRef, callback) => {
                onSnapshotCallback = callback;
                const data = mockDatabase['test-user-123'];
                // Chamar imediatamente com os dados iniciais (ou a ausência deles)
                callback({ exists: () => !!data, data: () => data });
                return () => { onSnapshotCallback = null; }; // Função de anulação de subscrição
            },
            updateDoc: async (docRef, dataToUpdate) => {
                const userId = 'test-user-123';
                let currentUserData = mockDatabase[userId];

                Object.keys(dataToUpdate).forEach(key => {
                    if (key.includes('.')) {
                        const keys = key.split('.');
                        let temp = currentUserData;
                        for (let i = 0; i < keys.length - 1; i++) {
                            temp[keys[i]] = temp[keys[i]] || {};
                            temp = temp[keys[i]];
                        }
                        temp[keys[keys.length - 1]] = dataToUpdate[key];
                    } else {
                        currentUserData[key] = dataToUpdate[key];
                    }
                });

                if (onSnapshotCallback) {
                    const updatedData = mockDatabase[userId];
                    onSnapshotCallback({ exists: () => !!updatedData, data: () => updatedData });
                }
            },
            signInAnonymously: async () => ({ user: { uid: 'test-user-123' } }),
            signInWithCustomToken: async () => ({ user: { uid: 'test-user-123' } })
        };

        const { initializeApp, getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken, getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc } = mockFirebase;

        // --- CONFIGURAÇÃO E INICIALIZAÇÃO DO FIREBASE ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Erro ao inicializar o Firebase:", error);
        }

        // --- DADOS DA APLICAÇÃO (CONTEÚDO DAS LIÇÕES COM IMAGENS) ---
        const TOPICS = [
            // NÍVEL BÁSICO (10 TÓPICOS)
            { id: 1, level: 'Básico 1', title: 'O Começo: Saudações e o Verbo "To Be"', icon: 'bi-mortarboard-fill', color: 'bg-success', imageUrl: 'https://images.pexels.com/photos/3755755/pexels-photo-3755755.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Saudações Comuns', content: 'Em inglês, usamos "Hello" (Olá) e "Hi" (Oi) como saudações universais. Para perguntar como alguém está, dizemos "How are you?".', imageUrl: 'https://images.pexels.com/photos/1438081/pexels-photo-1438081.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' }, { type: 'theory', title: 'Verbo "To Be": Afirmativa', content: 'O verbo "To Be" (Ser/Estar) é fundamental. Suas formas no presente são: I am (Eu sou/estou), You are (Você é/está), He/She/It is (Ele/Ela é/está).' }, { type: 'fill-in', question: 'Preencha a lacuna: I ___ happy.', answer: 'am', xp: 10 }, { type: 'mc', question: 'Qual a tradução de "How are you?"', options: ['Qual o seu nome?', 'Como você está?', 'De onde você é?'], answer: 'Como você está?', xp: 10 }, { type: 'theory', title: 'Verbo "To Be": Negativa e Interrogativa', content: 'Para negar, adicione "not" após o verbo (I am not). Para perguntar, inverta o verbo e o sujeito (Are you?).' }, { type: 'fill-in', question: 'Complete a frase: She ___ a doctor.', answer: 'is', xp: 10 }, { type: 'mc', question: 'Como se diz "Oi" em inglês?', options: ['Bye', 'Ok', 'Hi'], answer: 'Hi', xp: 10 }, { type: 'mc', question: 'Passe para a negativa: "They are friends."', options: ['They not are friends.', 'They are not friends.', 'They is not friends.'], answer: 'They are not friends.', xp: 15 } ] },
            { id: 2, level: 'Básico 1', title: 'Artigos e Plurais', icon: 'bi-journal-text', color: 'bg-success', imageUrl: 'https://images.pexels.com/photos/256450/pexels-photo-256450.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Artigos Definidos e Indefinidos', content: 'Use "the" para substantivos específicos (the book - o livro) e "a/an" para substantivos não específicos (a book - um livro). "An" é usado antes de sons de vogal (an apple).' }, { type: 'mc', question: 'Qual artigo usar antes de "apple"?', options: ['a', 'the', 'an'], answer: 'an', xp: 10 }, { type: 'theory', title: 'Formando Plurais Regulares', content: 'A maioria dos plurais é formada adicionando -s (book -> books). Para palavras que terminam em s, x, ch, sh, adicionamos -es (box -> boxes).' }, { type: 'fill-in', question: 'O plural de "cat" é ___.', answer: 'cats', xp: 10 }, { type: 'theory', title: 'Plurais Irregulares', content: 'Algumas palavras têm plurais irregulares, como man -> men, woman -> women, child -> children, person -> people.' }, { type: 'mc', question: 'Qual o plural de "child"?', options: ['childs', 'childes', 'children'], answer: 'children', xp: 15 } ] },
            { id: 3, level: 'Básico 2', title: 'Simple Present: Rotinas', icon: 'bi-book-half', color: 'bg-success', imageUrl: 'https://images.pexels.com/photos/3184465/pexels-photo-3184465.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Usando o Simple Present', content: 'Usamos o Simple Present para falar de hábitos e rotinas. Ex: "I work every day." (Eu trabalho todo dia).' }, { type: 'theory', title: 'Regra do "-s"', content: 'Para He, She e It, adicionamos "-s" ao final do verbo. Ex: "She works at a hospital."' }, { type: 'fill-in', question: 'Complete: They ___ (live) in New York.', answer: 'live', xp: 10 }, { type: 'theory', title: 'Negativas e Interrogativas com Do/Does', content: 'Use "do not" (don\'t) e "does not" (doesn\'t) para negar. Use "Do" e "Does" no início para perguntar. Ex: "She doesn\'t work here.", "Do you speak English?".' }, { type: 'fill-in', question: 'Complete: He ___ (play) soccer on weekends.', answer: 'plays', xp: 15 }, { type: 'mc', question: 'Qual frase está correta?', options: ['She play tennis.', 'She plays tennis.', 'She is play tennis.'], answer: 'She plays tennis.', xp: 20 }, { type: 'mc', question: 'Qual a pergunta correta?', options: ['He does like coffee?', 'Does he like coffee?', 'Do he like coffee?'], answer: 'Does he like coffee?', xp: 20 } ] },
            { id: 4, level: 'Básico 2', title: 'Gostos e Preferências', icon: 'bi-chat-square-dots-fill', color: 'bg-success', imageUrl: 'https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Verbos de Preferência', content: 'Usamos verbos como "like" (gostar), "love" (amar) e "hate" (odiar) para expressar preferências.' }, { type: 'mc', question: 'O que significa "I like pizza"?', options: ['Eu odeio pizza', 'Eu sou uma pizza', 'Eu gosto de pizza'], answer: 'Eu gosto de pizza', xp: 10 }, { type: 'fill-in', question: 'Complete: I ___ chocolate.', answer: 'love', xp: 10, hint: 'O verbo para "amar"' }, { type: 'theory', title: 'Perguntando sobre preferências', content: 'Para perguntar, usamos "Do you like...?". Ex: "Do you like rock music?".' }, { type: 'mc', question: 'Como perguntar se alguém gosta de cães?', options: ['You like dogs?', 'Are you like dogs?', 'Do you like dogs?'], answer: 'Do you like dogs?', xp: 15 } ] },
            { id: 5, level: 'Básico 3', title: 'Present Continuous', icon: 'bi-hourglass-split', color: 'bg-info', imageUrl: 'https://images.pexels.com/photos/3807755/pexels-photo-3807755.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Ações em Progresso', content: 'Usamos o Present Continuous para ações que estão a acontecer agora. Formação: verbo "to be" + verbo com -ing. Ex: "I am studying English."' }, { type: 'fill-in', question: 'Complete: You ___ (watch) a movie.', answer: 'are watching', xp: 15 }, { type: 'mc', question: 'O que ele está a fazer? He ___ (read) a book.', options: ['is reading', 'are reading', 'am reading'], answer: 'is reading', xp: 15 }, { type: 'theory', title: 'Perguntas no Present Continuous', content: 'Para perguntar, inverta o verbo "to be" e o sujeito. Ex: "Are you listening to me?".' }, { type: 'mc', question: 'Qual a pergunta correta?', options: ['What you are doing?', 'What are you doing?', 'What do you doing?'], answer: 'What are you doing?', xp: 20 } ] },
            { id: 6, level: 'Básico 3', title: 'Simple Past: Verbos Regulares', icon: 'bi-film', color: 'bg-info', imageUrl: 'https://images.pexels.com/photos/7991579/pexels-photo-7991579.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Falando sobre o Passado', content: 'Para verbos regulares, adicionamos "-ed" para formar o passado. Ex: "work" -> "worked". "I worked yesterday."' }, { type: 'fill-in', question: 'Ontem, eu ___ (play) video games.', answer: 'played', xp: 10 }, { type: 'fill-in', question: 'Ela ___ (watch) the movie last night.', answer: 'watched', xp: 15 }, { type: 'theory', title: 'Regras de Ortografia para "-ed"', content: 'Se o verbo termina em "e", adicione apenas "d" (live -> lived). Se termina em consoante + "y", troque "y" por "ied" (study -> studied).' }, { type: 'fill-in', question: 'Ele ___ (study) para o teste.', answer: 'studied', xp: 15 } ] },
            { id: 7, level: 'Básico 4', title: 'Simple Past: Verbos Irregulares', icon: 'bi-exclamation-diamond-fill', color: 'bg-info', imageUrl: 'https://images.pexels.com/photos/163064/play-stone-network-networked-interactive-163064.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Exceções à Regra', content: 'Verbos irregulares têm formas próprias no passado. Ex: "go" -> "went", "see" -> "saw", "eat" -> "ate". É preciso memorizá-los.' }, { type: 'mc', question: 'Qual o passado de "go"?', options: ['goed', 'went', 'gone'], answer: 'went', xp: 15 }, { type: 'fill-in', question: 'Eu ___ (see) a great movie last week.', answer: 'saw', xp: 15 }, { type: 'mc', question: 'Qual o passado de "eat"?', options: ['eated', 'ate', 'eaten'], answer: 'ate', xp: 15 } ] },
            { id: 8, level: 'Básico 4', title: 'Perguntas com "Did"', icon: 'bi-question-circle-fill', color: 'bg-info', imageUrl: 'https://images.pexels.com/photos/356079/pexels-photo-356079.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Fazendo Perguntas no Passado', content: 'Usamos "Did" para fazer perguntas no Simple Past. O verbo principal volta à sua forma base. Ex: "Did you work yesterday?"' }, { type: 'mc', question: 'Qual a forma correta?', options: ['Did you worked?', 'Did you work?', 'You worked?'], answer: 'Did you work?', xp: 20 }, { type: 'theory', title: 'Negativas com "Did not"', content: 'Para negar no passado, usamos "did not" (didn\'t) + a forma base do verbo. Ex: "I didn\'t go to the party."' }, { type: 'fill-in', question: 'Ela não ___ (see) o filme. She ___ see the movie.', answer: 'didn\'t', xp: 20 } ] },
            { id: 9, level: 'Básico 5', title: 'Futuro com "Will" e "Going to"', icon: 'bi-briefcase-fill', color: 'bg-primary', imageUrl: 'https://images.pexels.com/photos/3184292/pexels-photo-3184292.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Futuro Simples', content: 'Use "will" para decisões espontâneas e previsões. Ex: "I think it will rain." Use "going to" para planos já decididos. Ex: "I am going to travel next month."' }, { type: 'mc', question: 'Para um plano já feito, usamos:', options: ['will', 'going to'], answer: 'going to', xp: 15 }, { type: 'mc', question: 'Para uma decisão no momento da fala, usamos:', options: ['will', 'going to'], answer: 'will', xp: 15 }, { type: 'fill-in', question: 'Look at the clouds! It is ___ rain.', answer: 'going to', xp: 20 } ] },
            { id: 10, level: 'Básico 5', title: 'Objetos e Possessivos', icon: 'bi-person-badge-fill', color: 'bg-primary', imageUrl: 'https://images.pexels.com/photos/4145190/pexels-photo-4145190.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Pronomes Objeto', content: 'Substituem o substantivo que recebe a ação. Me, you, him, her, it, us, them. Ex: "She called me."' }, { type: 'fill-in', question: 'I love you. Do you love ___?', answer: 'me', xp: 10 }, { type: 'theory', title: 'Adjetivos Possessivos', content: 'Indicam posse e vêm ANTES do substantivo. My, your, his, her, its, our, their. Ex: "This is my book."' }, { type: 'fill-in', question: 'That is ___ (dele) car.', answer: 'his', xp: 15 }, { type: 'theory', title: 'Pronomes Possessivos', content: 'Também indicam posse, mas substituem o substantivo. Mine, yours, his, hers, its, ours, theirs. Ex: "This book is mine."' }, { type: 'fill-in', question: 'This is her book. The book is ___.', answer: 'hers', xp: 20 } ] },

            // NÍVEL INTERMEDIÁRIO (10 TÓPICOS)
            { id: 11, level: 'Intermediário 1', title: 'Present Perfect: Experiências', icon: 'bi-award-fill', color: 'bg-primary', imageUrl: 'https://images.pexels.com/photos/380769/pexels-photo-380769.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Conectando Passado e Presente', content: 'Usamos o Present Perfect (have/has + particípio) para falar de experiências de vida sem especificar quando. Ex: "I have been to Japan."' }, { type: 'mc', question: 'Qual frase indica uma experiência de vida?', options: ['I went to the store.', 'I have seen that movie.', 'I will go tomorrow.'], answer: 'I have seen that movie.', xp: 15 }, { type: 'fill-in', question: 'She has never ___ (eat) sushi.', answer: 'eaten', xp: 20 }, { type: 'theory', title: 'Ever e Never', content: '"Ever" é usado em perguntas sobre experiências (Have you ever been to Canada?). "Never" é usado em negativas para dizer que nunca teve a experiência (I have never been there).' }, { type: 'mc', question: 'Complete: Have you ___ seen a ghost?', options: ['never', 'ever'], answer: 'ever', xp: 20 } ] },
            { id: 12, level: 'Intermediário 1', title: 'Present Perfect vs. Simple Past', icon: 'bi-calendar-range-fill', color: 'bg-primary', imageUrl: 'https://images.pexels.com/photos/5965949/pexels-photo-5965949.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Quando usar cada um?', content: 'Use Simple Past para ações concluídas em um tempo específico ("I saw the movie yesterday"). Use Present Perfect para ações em um tempo não específico ou que continuam até o presente ("I have seen the movie").' }, { type: 'mc', question: 'Complete: I ___ to Paris last year.', options: ['have been', 'went'], answer: 'went', xp: 20 }, { type: 'mc', question: 'Complete: She ___ three books so far.', options: ['wrote', 'has written'], answer: 'has written', xp: 20 }, { type: 'theory', title: 'Palavras-chave', content: 'Simple Past: yesterday, last week, in 2010. Present Perfect: ever, never, already, yet, so far.' }, { type: 'fill-in', question: 'I ___ (not finish) my homework yet.', answer: 'have not finished', xp: 25 } ] },
            { id: 13, level: 'Intermediário 2', title: 'Adjetivos Comparativos e Superlativos', icon: 'bi-trophy-fill', color: 'bg-secondary', imageUrl: 'https://images.pexels.com/photos/220357/pexels-photo-220357.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Comparando Coisas', content: 'Comparativos: adjetivos curtos + "-er" (bigger), ou "more" + adjetivos longos (more beautiful). Superlativos: "the" + adjetivo curto + "-est" (the biggest), ou "the most" + adjetivo longo (the most beautiful).' }, { type: 'fill-in', question: 'A car is ___ (fast) than a bicycle.', answer: 'faster', xp: 15 }, { type: 'theory', title: 'Comparativos e Superlativos Irregulares', content: 'Alguns são irregulares: good -> better -> the best; bad -> worse -> the worst; far -> farther/further -> the farthest/furthest.' }, { type: 'fill-in', question: 'This is the ___ (interesting) book I have ever read.', answer: 'most interesting', xp: 20 }, { type: 'mc', question: 'Qual o superlativo de "good"?', options: ['goodest', 'better', 'the best'], answer: 'the best', xp: 20 } ] },
            { id: 14, level: 'Intermediário 2', title: 'Verbos Modais: Habilidade e Permissão', icon: 'bi-check-circle-fill', color: 'bg-secondary', imageUrl: 'https://images.pexels.com/photos/1181345/pexels-photo-1181345.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Can, Could, May', content: '"Can" expressa habilidade no presente (I can swim). "Could" é o passado de "can" ou uma forma mais educada para pedidos (Could you help me?). "May" é usado para pedir permissão formalmente (May I help you?).' }, { type: 'mc', question: 'Para pedir permissão a um professor, qual é mais educado?', options: ['Can I go?', 'May I go?'], answer: 'May I go?', xp: 15 }, { type: 'fill-in', question: 'When I was a child, I ___ run very fast.', answer: 'could', xp: 20 } ] },
            { id: 15, level: 'Intermediário 3', title: 'Verbos Modais: Obrigação e Proibição', icon: 'bi-sign-stop-fill', color: 'bg-dark', imageUrl: 'https://images.pexels.com/photos/265076/pexels-photo-265076.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Must, Have to, Mustn\'t', content: '"Must" e "have to" expressam obrigação (You must stop). "Must" é uma obrigação interna, "have to" é externa (regra). "Mustn\'t" expressa proibição (You mustn\'t smoke here).' }, { type: 'fill-in', question: 'You ___ wear a seatbelt in the car. It\'s the law.', answer: 'have to', xp: 20 }, { type: 'mc', question: 'O que significa "You mustn\'t be late"?', options: ['Você não precisa de se atrasar.', 'É proibido atrasar-se.', 'Você pode atrasar-se.'], answer: 'É proibido atrasar-se.', xp: 20 } ] },

            { id: 17, level: 'Intermediário 4', title: 'Primeira Condicional: Causa e Efeito', icon: 'bi-diagram-2-fill', color: 'bg-dark', imageUrl: 'https://images.pexels.com/photos/7130560/pexels-photo-7130560.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1', lessons: [ { type: 'theory', title: 'Situações Reais no Futuro', content: 'Usamos a Primeira Condicional para falar de resultados prováveis no futuro. Estrutura: If + Simple Present, ... will + verbo. Ex: "If it rains, I will stay home."' }, { type: 'fill-in', question: 'If you ___ (study), you will pass the exam.', answer: 'study', xp: 20 }, { type: 'fill-in', question: 'I ___ (call) you if I have time.', answer: 'will call', xp: 20 } ] },

        function useAuth() {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          useEffect(() => {
            if (!auth) { setLoading(false); return; }
            const authUser = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) { console.error("Auth Error:", error); }
            };
            authUser();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              setLoading(false);
            });
            return () => unsubscribe();
          }, []);
          return { user, loading };
        }

        function useUserData(userId) {
          const [userData, setUserData] = useState(null);
          const [loading, setLoading] = useState(true);
          useEffect(() => {
            if (!userId || !db) { setLoading(false); return; }
            const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, 'data');
            const unsubscribe = onSnapshot(userDocRef, (docSnap) => {
              if (docSnap.exists()) {
                setUserData(docSnap.data());
              } else {
                setUserData(null);
              }
              setLoading(false);
            }, (error) => { console.error("User Data Error:", error); setLoading(false); });
            return () => unsubscribe();
          }, [userId]);
          return { userData, loading };
        }

        async function initializeUserData(userId, level) {
          if (!db) return;
          const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, 'data');
          await setDoc(userDocRef, {
            name: "Novo Aluno",
            email: "aluno@email.com",
            level: level,
            xp: 0,
            createdAt: new Date(),
            lastStudied: new Date().toISOString().split('T')[0],
            streak: 1,
            topicProgress: {}
          });
        }

        async function updateUserProgress(userId, topicId, lessonId, gainedXp) {
            if (!db) return;
            const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, 'data');
            const docSnap = await getDoc(userDocRef);
            if (!docSnap.exists()) return;
            const userData = docSnap.data();
            const newXp = (userData.xp || 0) + gainedXp;
            const progressKey = `topicProgress.${topicId}.completed`;
            const currentCompleted = userData.topicProgress?.[topicId]?.completed || [];
            const newCompleted = [...new Set([...currentCompleted, lessonId])];
            await updateDoc(userDocRef, { xp: newXp, [progressKey]: newCompleted });
        }

        async function completeTopic(userId, topicId) {
            if (!db) return;
            const userDocRef = doc(db, `artifacts/${appId}/users/${userId}/profile`, 'data');
            const docSnap = await getDoc(userDocRef);
            if (!docSnap.exists()) return;
            const userData = docSnap.data();
            const currentLevel = userData.level || 1;
            const newLevel = Math.max(currentLevel, topicId + 1);
            await updateDoc(userDocRef, { level: newLevel, [`topicProgress.${topicId}.status`]: 'completed' });
        }

        const LevelTest = ({ onTestComplete }) => {
          const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [feedback, setFeedback] = useState(null);

          const handleOptionClick = (option) => {
            if (feedback) return;
            setSelectedOption(option);
            const isCorrect = option === LEVEL_TEST_QUESTIONS[currentQuestionIndex].correctAnswer;
            if (isCorrect) {
              setScore(score + LEVEL_TEST_QUESTIONS[currentQuestionIndex].difficulty);
              setFeedback({ correct: true, message: 'Correto!' });
            } else {
              setFeedback({ correct: false, message: 'Ops, tente novamente.' });
            }
            setTimeout(() => {
              setFeedback(null);
              setSelectedOption(null);
              if (currentQuestionIndex < LEVEL_TEST_QUESTIONS.length - 1) {
                setCurrentQuestionIndex(currentQuestionIndex + 1);
              } else {
                let finalLevel = 1;
                const finalScore = score + (isCorrect ? LEVEL_TEST_QUESTIONS[currentQuestionIndex].difficulty : 0);
                if (finalScore >= 9) finalLevel = 21;
                else if (finalScore >= 5) finalLevel = 11;
                else if (finalScore >= 2) finalLevel = 5;
                onTestComplete(finalLevel);
              }
            }, 1500);
          };
          
          const question = LEVEL_TEST_QUESTIONS[currentQuestionIndex];
          return (
            <div className="d-flex align-items-center justify-content-center" style={{minHeight: '100vh', backgroundColor: '#f8f9fa'}}>

                                </button>
                            </div>
                        ))}
                       </div>
                       {feedback && <div className={`mt-4 text-center h5 ${feedback.correct ? 'text-success' : 'text-danger'}`}>{feedback.message}</div>}
                    </div>
                </div>
            </div>
          );

              <div className="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 className="h2">Painel de Aulas</h1>
                <div className="btn-toolbar mb-2 mb-md-0">
                  <div className="btn-group me-3">
                    <div className="d-flex align-items-center gap-2" title="Sequência de estudos">
                        <i className="bi bi-lightning-charge-fill text-warning"></i>
                        <span className="fw-bold">{userData.streak || 1} dias</span>
                    </div>
                  </div>
                   <div className="d-flex align-items-center gap-2" title="Pontos de Experiência">
                        <i className="bi bi-star-fill text-primary"></i>
                        <span className="fw-bold">{userData.xp} XP</span>
                    </div>
                </div>
              </div>
              <p className="text-muted">Olá {userData.name}, bem-vindo de volta! O seu nível atual é <span className={`fw-bold`}>{currentLevelInfo.level}</span>.</p>
              
              <div className="row g-4 mt-2">
                {TOPICS.map(topic => {
                  const progressData = userData.topicProgress?.[topic.id];
                  const completedCount = progressData?.completed?.length || 0;
                  const totalLessons = topic.lessons.filter(l => l.type !== 'theory').length;
                  const progress = totalLessons > 0 ? (completedCount / totalLessons) * 100 : (progressData?.status === 'completed' ? 100 : 0);
                  const isLocked = topic.id > userData.level;

                  return (
                    <div className="col-12 col-md-6 col-lg-4 col-xl-3" key={topic.id}>
                        <div 
                            onClick={!isLocked ? () => onTopicClick(topic) : undefined} 
                            className={`card h-100 shadow-sm border-0 transition-all position-relative ${isLocked ? 'bg-light opacity-75' : 'cursor-pointer hover-shadow'}`}
                        >
                            <div 
                                className="card-img-top"
                                style={{
                                    backgroundImage: `url(${topic.imageUrl})`, 
                                    backgroundSize: 'cover', 
                                    backgroundPosition: 'center',
                                    height: '120px'
                                }}
                            >
                                <div className="d-flex justify-content-end p-2" style={{backgroundColor: 'rgba(0,0,0,0.2)', height: '100%'}}>
                                     <i className={`bi ${isLocked ? 'bi-lock-fill' : topic.icon} text-white fs-4`}></i>
                                </div>
                            </div>
                            <div className="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 className="card-title h6 mb-1 text-dark fw-bold">{topic.title}</h5>
                                    <small className="text-muted">{topic.level}</small>
                                </div>
                                <div className="mt-3">
                                   {progress > 0 && (
                                        <div className="progress" style={{height: '6px'}}>
                                            <div className={`progress-bar ${topic.color}`} role="progressbar" style={{ width: `${progress}%`}} aria-valuenow={progress} aria-valuemin="0" aria-valuemax="100"></div>
                                        </div>
                                    )}
                                    {progress === 100 && <div className="text-end small fw-bold text-success mt-1">Concluído!</div>}
                                </div>
                            </div>
                        </div>
                    </div>
                  );
                })}
              </div>
            </React.Fragment>
          );
        };

        const LessonScreen = ({ topic, userData, onBack }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [inputValue, setInputValue] = useState('');
            const [feedback, setFeedback] = useState(null); // null, 'correct', 'incorrect'
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const userId = auth?.currentUser?.uid;

            const currentCard = topic.lessons[currentIndex];
            const exerciseLessons = useMemo(() => topic.lessons.filter(l => l.type !== 'theory'), [topic.lessons]);
            const totalExercises = exerciseLessons.length;
            const completedExercises = useMemo(() => {
                const progress = userData.topicProgress?.[topic.id]?.completed || [];
                return exerciseLessons.filter((_, index) => progress.includes(index)).length;
            }, [userData, topic.id, exerciseLessons]);

            useEffect(() => {
                if (currentCard?.type === 'mc') {
                    setShuffledOptions([...currentCard.options].sort(() => Math.random() - 0.5));
                }
            }, [currentCard]);

            const handleAnswer = async () => {
                if (!currentCard || feedback) return;
                let isCorrect = false;
                if (currentCard.type === 'fill-in') {
                    isCorrect = inputValue.trim().toLowerCase() === currentCard.answer.toLowerCase();
                }
                setFeedback(isCorrect ? 'correct' : 'incorrect');
                if (isCorrect) {
                    const lessonIdentifier = currentIndex;
                    const progress = userData.topicProgress?.[topic.id]?.completed || [];
                    if (!progress.includes(lessonIdentifier)) {
                         await updateUserProgress(userId, topic.id, lessonIdentifier, currentCard.xp);
                    }
                }
                setTimeout(async () => {
                    if (isCorrect) {
                        if (currentIndex < topic.lessons.length - 1) {
                            setCurrentIndex(currentIndex + 1); setInputValue('');
                        } else {
                            await completeTopic(userId, topic.id); onBack();
                        }
                    }
                    setFeedback(null);
                }, 1500);
            };

            const handleMcAnswer = async (option) => {
                if (feedback) return;
                const isCorrect = option === currentCard.answer;
                setFeedback(isCorrect ? 'correct' : 'incorrect');
                if (isCorrect) {
                    const lessonIdentifier = currentIndex;
                    const progress = userData.topicProgress?.[topic.id]?.completed || [];
                    if (!progress.includes(lessonIdentifier)) {
                        await updateUserProgress(userId, topic.id, lessonIdentifier, currentCard.xp);
                    }
                }
                setTimeout(async () => {
                    if (isCorrect) {
                        if (currentIndex < topic.lessons.length - 1) {
                            setCurrentIndex(currentIndex + 1);
                        } else {
                            await completeTopic(userId, topic.id); onBack();
                        }
                    }
                    setFeedback(null);
                }, 1500);
            };
            
            const progressPercentage = totalExercises > 0 ? (completedExercises / totalExercises) * 100 : 0;

            return (
                <div className="w-100 mx-auto py-4" style={{maxWidth: '800px'}}>
                    <header className="d-flex align-items-center justify-content-between mb-4">
                        <button onClick={onBack} className="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2"><i className="bi bi-house-fill"></i> Voltar</button>
                        <h2 className="h4 mb-0 fw-bold">{topic.title}</h2>
                        <div style={{width: '80px'}}></div>
                    </header>
                    <div className="progress mb-4" style={{height: '8px'}}>
                        <div className="progress-bar bg-success" role="progressbar" style={{ width: `${progressPercentage}%` }}></div>
                    </div>
                    <div className={`p-4 p-md-5 rounded-3 shadow-sm transition-all ${feedback === 'correct' ? 'bg-success-subtle' : feedback === 'incorrect' ? 'bg-danger-subtle' : 'bg-white'}`}>
                        
                        {currentCard.type === 'theory' && (
                            <div className="text-center">
                                {currentCard.imageUrl && <img src={currentCard.imageUrl} alt={currentCard.title} className="img-fluid rounded-3 mb-4 shadow-sm" style={{maxHeight: '250px', objectFit: 'cover', width: '100%'}} />}
                                <h3 className="h4 fw-bold text-primary mb-3">{currentCard.title}</h3>
                                <p className="lead text-muted">{currentCard.content}</p>
                            </div>
                        )}

                        {currentCard.type === 'fill-in' && (
                            <div>
                                <p className="h5 text-center text-dark mb-4">{currentCard.question}</p>
                                <input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} className="form-control form-control-lg text-center" placeholder="Sua resposta..." />
                            </div>
                        )}

                        {currentCard.type === 'mc' && (
                             <div>
                                <p className="h5 text-center text-dark mb-4">{currentCard.question}</p>
                                <div className="d-grid gap-3">
                                    {shuffledOptions.map((opt, i) => (
                                        <button key={i} onClick={() => handleMcAnswer(opt)} className={`btn btn-lg p-3 ${feedback ? (opt === currentCard.answer ? 'btn-success' : 'btn-danger') : 'btn-outline-secondary'}`}>{opt}</button>
                                    ))}
                                </div>
                            </div>
                        )}

                    </div>
                    {currentCard.type !== 'mc' && (
                        <div className="mt-4 text-center">
                            <button onClick={currentCard.type === 'theory' ? () => setCurrentIndex(currentIndex + 1) : handleAnswer} className="btn btn-primary btn-lg px-5">
                                {currentCard.type === 'theory' ? 'Próximo' : 'Verificar'} <i className="bi bi-arrow-right ms-2"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const PlaceholderScreen = ({title}) => (
            <div className="pt-3 pb-2 mb-3">
                <h1 className="h2">{title}</h1>
                <div className="bg-white p-5 rounded-3 text-center mt-4">
                    <h2 className="text-muted">Em construção</h2>
                    <p>Esta secção estará disponível em breve.</p>
                </div>
            </div>
        );

        // --- COMPONENTE PRINCIPAL ---
        function App() {
          const { user, loading: authLoading } = useAuth();
          const { userData, loading: userDataLoading } = useUserData(user?.uid);
          const [currentView, setCurrentView] = useState('loading'); // loading, levelTest, dashboard, lesson, profile, settings, help
          const [activeTopic, setActiveTopic] = useState(null);

          useEffect(() => {
            if (authLoading || userDataLoading) {
              setCurrentView('loading');
            } else if (user && userData) {
              if (currentView === 'levelTest' || currentView === 'loading') {
                  setCurrentView('dashboard');
              }
            } else if (user && !userData) {
              setCurrentView('levelTest');
            } else if (!user && !authLoading) {
                setCurrentView('error');
            }
          }, [user, userData, authLoading, userDataLoading]);

          const handleTestComplete = async (level) => {
            if (user) {
              await initializeUserData(user.uid, level);
            }
          };
          
          const handleTopicClick = (topic) => {
            if (topic.lessons && topic.lessons.length > 0) {
                setActiveTopic(topic);
                setCurrentView('lesson');
            } else {
                console.warn("Este tópico ainda não possui lições. Conteúdo em breve!");
            }
          };
          
          const handleBackToDashboard = () => {
              setActiveTopic(null);
              setCurrentView('dashboard');
          }

          const renderContent = () => {
            if (currentView === 'loading') return <LoadingSpinner />;
            if (currentView === 'error') return <div className="text-center text-danger">Ocorreu um erro de autenticação. Por favor, recarregue a página.</div>;
            if (currentView === 'levelTest') return <LevelTest onTestComplete={handleTestComplete} />;
            
            let viewComponent;
            switch (currentView) {
              case 'dashboard':
                viewComponent = <Dashboard userData={userData} onTopicClick={handleTopicClick} />;
                break;
              case 'lesson':
                viewComponent = <LessonScreen topic={activeTopic} userData={userData} onBack={handleBackToDashboard} />;
                break;
              case 'profile':
                viewComponent = <PlaceholderScreen title="Perfil"/>;
                break;
              case 'settings':
                viewComponent = <PlaceholderScreen title="Configurações"/>;
                break;
              case 'help':
                viewComponent = <PlaceholderScreen title="Central de Ajuda"/>;
                break;
              default:
                viewComponent = <Dashboard userData={userData} onTopicClick={handleTopicClick} />;
            }

            return (
                <React.Fragment>
                    <AppHeader userData={userData} />
                    <div className="container-fluid">
                        <div className="row">
                            <Sidebar currentView={currentView} setView={setCurrentView} />
                            <main className="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                                {viewComponent}
                            </main>
                        </div>
                    </div>
                </React.Fragment>
            );
          };

          return renderContent();
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23ff6a13%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2214%22 font-family=%22Impact,sans-serif%22 text-anchor=%22middle%22 fill=%22%23000%22%3EM%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Almoxarifado Madrasta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: faixa de cabeçalho com o sol laranja da logo atrás do escudo, abas fixas, conteúdo em cartões por grupo.
   Visual único (escuro), como a logo da bateria: preto, laranja em raios, estrelas douradas e prateadas. */
:root {
  --ink: #0b0a09;          /* fundo */
  --panel: #171412;        /* cartões */
  --panel-2: #211c18;      /* campos, linhas */
  --line: #3a312a;
  --text: #f6f1ea;
  --muted: #b3a79a;
  --sun: #ff6a13;          /* laranja forte dos raios */
  --sun-soft: #ffa25e;     /* laranja claro dos raios */
  --gold: #e3c55a;         /* estrelas de cima */
  --silver: #cfccc2;       /* estrelas de baixo */
  --ok: #46c387;           /* boa */
  --tune: #e9b93a;         /* precisa afinar */
  --fix: #ef4d48;          /* precisa consertar */
  --off: #7b736b;          /* fora de uso */
  --f-display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a.btn { color: inherit; text-decoration: none; }
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---- cabeçalho ---- */
.hero { position: relative; overflow: hidden; border-bottom: 3px solid var(--sun); }
.hero::before { content: ""; position: absolute; left: -10%; top: 50%; width: 900px; height: 900px; transform: translate(0, -50%);
  background: repeating-conic-gradient(from 0deg at 50% 50%, var(--sun) 0deg 9deg, var(--sun-soft) 9deg 18deg);
  border-radius: 50%; opacity: .2; -webkit-mask: radial-gradient(circle, #000 0 38%, transparent 70%); mask: radial-gradient(circle, #000 0 38%, transparent 70%); }
.hero .wrap { position: relative; display: flex; align-items: center; gap: 18px; padding-block: 18px 16px; }
.hero img { width: 96px; height: auto; flex: none; mix-blend-mode: lighten; }
.hero h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); line-height: .95; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.hero h1 span { color: var(--sun); }
.hero p { margin: 6px 0 0; color: var(--muted); font-family: var(--f-cond); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.hero .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.hero .who img { width: 28px; height: 28px; border-radius: 50%; filter: none; }

/* ---- abas ---- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tabs a { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 13px 14px 11px; color: var(--muted); text-decoration: none; font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; border-bottom: 3px solid transparent; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-color: var(--sun); }
.tabs .count { font-size: 12px; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--panel-2); color: var(--text); text-align: center; }
.tabs .count.hot { background: var(--fix); }

main { padding-block: 20px 60px; display: flex; flex-direction: column; gap: 22px; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
.banner b { color: var(--gold); }
.banner.warn { border-color: color-mix(in srgb, var(--tune) 60%, var(--line)); }

h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; letter-spacing: .03em; text-transform: uppercase; }
h3 { margin: 0; font-family: var(--f-cond); font-weight: 700; font-size: 19px; letter-spacing: .05em; text-transform: uppercase; }
.sec-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.sec-head .grow { flex: 1; }
.lbl { font-family: var(--f-cond); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---- botões e campos ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--sun-soft); }
.btn.primary { background: var(--sun); border-color: var(--sun); color: #160700; }
.btn.primary:hover { background: var(--sun-soft); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--fix); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 13px; border-radius: 7px; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-family: var(--f-cond); font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { width: 100%; min-height: 40px; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); }
textarea { min-height: 76px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sun); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--sun); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }

/* ---- status ---- */
.st-bom { --c: var(--ok); } .st-afinar { --c: var(--tune); } .st-consertar { --c: var(--fix); } .st-fora { --c: var(--off); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--c, var(--muted)) 18%, transparent); color: color-mix(in srgb, var(--c, var(--muted)) 80%, var(--text)); white-space: nowrap; }
.p-urgente { --c: var(--fix); } .p-alta { --c: var(--sun); } .p-media { --c: var(--tune); } .p-baixa { --c: var(--off); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.bar i { display: block; height: 100%; background: var(--c); }

/* ---- painel ---- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--c, var(--sun)); }
.kpi b { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; }
.kpi small { color: var(--muted); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.list { display: flex; flex-direction: column; }
.list > * { padding-block: 10px; border-top: 1px solid var(--line); }
.list > *:first-child { border-top: 0; padding-top: 2px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row .grow { flex: 1; min-width: 0; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.ready { display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--panel-2) 0); }
.ring span { width: 70px; height: 70px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-family: var(--f-display); font-size: 24px; }
.grp-row { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: 14px; }

/* ---- inventário ---- */
.group { display: flex; flex-direction: column; gap: 12px; }
.group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
.group-head .stars { color: var(--gold); letter-spacing: 2px; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px; min-width: 0; }
.card.attn { border-color: color-mix(in srgb, var(--fix) 45%, var(--line)); }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.card-top h4 { margin: 0; font-family: var(--f-cond); font-weight: 700; font-size: 21px; line-height: 1.1; letter-spacing: .02em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.total { font-family: var(--f-display); font-size: 28px; line-height: 1; text-align: right; }
.total small { display: block; font-family: var(--f-cond); font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.steps.no-tune { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.step { display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 10px; background: var(--panel-2); border: 1px solid transparent; min-width: 0; }
.step.has { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.step .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .ctl { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.step .ctl b { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1; min-width: 26px; text-align: center; }
.step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); cursor: pointer; font-size: 18px; line-height: 1; display: grid; place-items: center; flex: none; }
.step button:hover { border-color: var(--c); }
.step .fixone { width: auto; height: auto; border: 0; border-radius: 0; background: none; padding: 0; display: inline; color: var(--ok); font-size: 12px; font-weight: 600; line-height: 1.3; cursor: pointer; text-align: left; }
.fixone:hover { text-decoration: underline; }
.meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.meta span { overflow-wrap: anywhere; }
.meta b { font-weight: 600; color: var(--text); }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---- demandas ---- */
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--panel) 55%, var(--ink)); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.task h5 { margin: 0; font-size: 15.5px; font-weight: 700; overflow-wrap: anywhere; }
.task p { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.late { color: var(--fix); font-weight: 600; }

/* ---- manutenções ---- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-family: var(--f-cond); font-size: 12px; color: var(--muted); text-align: center; letter-spacing: .08em; }
.cal .day { min-height: 46px; border-radius: 8px; background: var(--panel-2); padding: 4px 5px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; border: 1px solid transparent; cursor: pointer; text-align: left; }
.cal .day.out { background: transparent; color: var(--off); cursor: default; }
.cal .day.today { border-color: var(--sun); }
.cal .day.sel { background: color-mix(in srgb, var(--sun) 22%, var(--panel-2)); }
.cal .dots { display: flex; gap: 3px; flex-wrap: wrap; }
.cal .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--gold)); }
.mrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.date-chip { text-align: center; border-radius: 10px; background: var(--panel-2); padding: 6px 4px; line-height: 1.05; }
.date-chip b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.date-chip small { font-family: var(--f-cond); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.date-chip.late { background: color-mix(in srgb, var(--fix) 22%, var(--panel-2)); }

/* ---- histórico ---- */
.log-row { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.log-row img { width: 26px; height: 26px; border-radius: 50%; flex: none; }
.log-row .when { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

/* ---- modal e aviso ---- */
.modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.66); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--sun); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.start { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 22px; border: 1px dashed color-mix(in srgb, var(--sun) 55%, var(--line)); border-radius: 14px; background: var(--panel); }
.start p { margin: 0; color: var(--muted); max-width: 62ch; }

@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-2, .kanban, .cards { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .hero img { width: 70px; }
  .hero .who { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi b { font-size: 32px; }
  .steps, .steps.no-tune { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .grp-row { grid-template-columns: minmax(0, 110px) minmax(0, 1fr) 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

function toast(msg) {

  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}
function modal(title, body, actions) {
  const layer = $("layer"); layer.innerHTML = "";
  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc);
  const box = el("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title }, el("h3", { text: title }), body,
    el("div", { class: "modal-actions" }, actions(close)));
  const bg = el("div", { class: "modal-bg", onclick: e => { if (e.target === bg) close(); } }, box);
  layer.append(bg);
  const first = box.querySelector("input, select, textarea"); if (first) setTimeout(() => first.focus(), 30);
  return close;
}

  S.demandas = [{ id: newId(), titulo: "Exemplo: comprar 2 peles de caixa", tipo: "compra", prioridade: "alta", status: "aberta", responsavel: "", prazo: "", descricao: "" }];
  S.manut = [{ id: newId(), itemId: S.itens[1].id, tipo: "troca_pele", data: hoje(), quantidade: 1, responsavel: "", obs: "Exemplo", status: "agendada" }];
  S.log = [];
}
async function iniciar() {
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
  const c = window.claude;
  if (!c || !c.use) { exemplo(); render(); return; }
  const [db, user, dl] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads")].map(p => p.catch(() => null)));
  downloads = dl; S.user = user;
  if (!db) { exemplo(); render(); return; }
  S.db = db;
  if (user) {
    try { S.me = await user.me(); S.myId = S.me.id; } catch (e) {}
    try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch (e) {}
    if (S.me) { const w = $("who"); w.replaceChildren(el("img", { src: S.me.avatarUrl, alt: "" }), el("span", { text: S.me.name || "Você" })); }
  }
  const sub = (kind, q) => q.onSnapshot(snap => {
    // contadores com clique ainda não gravado ficam com o valor local até a gravação sair
    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (kind === "itens") for (const it of data) { const local = S.itens.find(x => x.id === it.id); if (pend.has(it.id) && local) it.qtd = local.qtd; }
    S[kind] = data; S.loaded[kind] = true; renderSoon();
  }, e => { S.loaded[kind] = true; if (e && e.code === "revoked") { S.canWrite = false; } renderSoon(); });
  sub("itens", db.collection(COL.itens));
  sub("demandas", db.collection(COL.demandas));
  sub("manut", db.collection(COL.manut));
  sub("log", db.collection(COL.log).orderBy("em", "desc").limit(150));
  // o histórico guarda um ano: apaga registros mais velhos aos poucos, para o banco não encher
  if (S.canWrite) setTimeout(async () => {
    try { const velhos = await db.collection(COL.log).where("em", "<", Date.now() - 365 * 864e5).limit(50).get(); for (const d of velhos.docs) await db.collection(COL.log).doc(d.id).delete(); } catch (e) {}
  }, 8000);
}
iniciar();
})();
</script>
